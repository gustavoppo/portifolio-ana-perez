<section class="px-12 flex flex-col gap-4">
  <h2 class="text-3xl font-bold text-neutral-100">Meus Momentos</h2>
  <p class="text-lg font-light text-neutral-100">
    Aqui estão alguns dos meus momentos favoritos:
  </p>
  <ul class="list-disc list-inside">
    @for(item of moments;track item){
    <li>
      <img class="moments-img" [src]=" item.url" [alt]="item.title" />
    </li>
    }
  </ul>
</section>
