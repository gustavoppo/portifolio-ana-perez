<section class="flex flex-col gap-4">
  <h2
    class="text-3xl xl:text-4xl font-bold text-neutral-100 text-center lg:text-start"
  >
    Meus Momentos
  </h2>
  <p class="text-lg font-light text-neutral-100 text-center lg:text-start">
    Aqui estão alguns dos meus momentos favoritos:
  </p>
  <ul
    class="moments flex flex-col lg:flex-row xl:justify-center items-center gap-4"
  >
    @for(item of moments;track item){
    <li>
      <img class="moments-img" [src]=" item.url" [alt]="item.title" />
    </li>
    }
  </ul>
</section>
