<section
  [attr.id]="id"
  class="px-8 md:px-12 flex flex-col items-center justify-center lg:items-start xl:items-center gap-8 xl:px-64"
>
  <div class="flex flex-col items-center justify-center lg:flex-row gap-4">
    <about-resume class="lg:w-4/6 xl:w-3/6" />
    <about-spotify class="xl:w-lg" />
  </div>
  <about-moments class="xl:w-full xl:px-20" />
  <div class="py-8 flex flex-col items-center gap-8">
    @if(!mobile){
    <social-links [socialLinks]="socialList" />
    <button-cta />
    }
  </div>
</section>
