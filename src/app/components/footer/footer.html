<footer
  class="flex flex-col gap-4 border-t border-neutral-50 px-8 pt-8 md:px-12 md:pt-12"
>
  <div class="flex flex-col gap-4 md:flex-row">
    <div class="flex flex-col gap-4 md:w-3/6">
      <h4 class="text-3xl font-black text-neutral-50">{{persona.name}}</h4>
      <p class="text-neutral-400 md:text-sm">{{persona.description}}</p>
      <social-links class="w-20" [socialLinks]="socialList" />
    </div>
    <div
      class="flex justify-around md:justify-end gap-4 md:gap-8 mt-8 md:mt-[0px] md:w-full"
    >
      <div>
        <h4 class="text-3xl font-semibold mb-4 text-neutral-50">Links</h4>
        <ul class="flex flex-col gap-2">
          @for(item of pesonalLinks;track item){
          <li>
            <a [href]="item.href" class="text-neutral-400">{{item.name}}</a>
          </li>
          }
        </ul>
      </div>
      <div>
        <h4 class="text-3xl font-semibold mb-4 text-neutral-50">Recursos</h4>
        <ul class="flex flex-col gap-2">
          @for(item of pesonalResources;track item){
          <li>
            <a
              class="text-neutral-400 cursor-pointer hover:underline"
              [href]="item.util"
              [attr.download]="item.isDownload ? '' : null"
              target="_blank"
              rel="noopener"
            >
              {{ item.name }}
            </a>
          </li>
          }
        </ul>
      </div>
    </div>
  </div>
  <developer />
</footer>

<span class="element"></span>
